# First installation only: serve the site and ACME HTTP-01 challenges.
server {
    listen 80;
    server_name docs.yydsapi.uno;
    root /srv/mydoc/current;
    index index.html;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/mydoc/acme;
    }
    location ~ /\. {
        deny all;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
