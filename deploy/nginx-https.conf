server {
    listen 80;
    server_name docs.yydsapi.uno;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/mydoc/acme;
    }
    location / {
        return 301 https://docs.yydsapi.uno$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name docs.yydsapi.uno;
    ssl_certificate /etc/letsencrypt/live/docs.yydsapi.uno/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.yydsapi.uno/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/mydoc/current;
    index index.html;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/mydoc/acme;
    }
    location ~ /\. {
        deny all;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    access_log /var/log/nginx/mydoc-access.log;
    error_log /var/log/nginx/mydoc-error.log;
}
